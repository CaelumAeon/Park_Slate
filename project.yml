name: ParkSlate
options:
  bundleIdPrefix: com.parkslate
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 5.10
    MARKETING_VERSION: 0.0.1
    CURRENT_PROJECT_VERSION: 1
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  ParkSlate:
    type: application
    platform: iOS
    sources:
      - path: ParkSlate
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.parkslate.app
        INFOPLIST_FILE: ParkSlate/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    scheme:
      testTargets: []
